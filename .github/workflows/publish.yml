name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if the packaged code is unchanged
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Resolve package name and version
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        continue-on-error: true
        run: npm ci --ignore-scripts

      - name: Inspect the tarball that would be published
        run: npm pack --dry-run

      - name: Fingerprint the packaged code
        id: fingerprint
        run: |
          node -e '
            const { execSync } = require("child_process");
            const { createHash } = require("crypto");
            const { readFileSync, appendFileSync } = require("fs");
            const raw = JSON.parse(execSync("npm pack --json --dry-run", { encoding: "utf8" }));
            const packed = Array.isArray(raw) ? raw[0] : raw[Object.keys(raw)[0]];
            const code = packed.files.map((f) => f.path).filter((p) => /\.(ts|tsx|js|mjs)$/.test(p)).sort();
            const hash = createHash("sha256");
            for (const p of code) { hash.update(p); hash.update(readFileSync(p)); }
            const digest = hash.digest("hex");
            console.log("::notice::code files in tarball: " + code.length);
            for (const p of code) console.log("::notice::  " + p);
            appendFileSync(process.env.GITHUB_OUTPUT, "hash=" + digest + "\n");
            appendFileSync(process.env.GITHUB_OUTPUT, "count=" + code.length + "\n");
          '
      - name: Read the fingerprint of the previous release
        id: previous
        run: |
          last=$(git tag -l "npm-release-*" --sort=-v:refname | head -n 1)
          echo "tag=$last" >> "$GITHUB_OUTPUT"
          prev=""
          if [ -n "$last" ]; then
            prev=$(git tag -l "$last" --format="%(contents)" | grep -oE "fingerprint: [0-9a-f]+" | head -n 1 | cut -d " " -f 2)
          fi
          echo "hash=$prev" >> "$GITHUB_OUTPUT"

      - name: Decide whether to publish
        id: decide
        env:
          FORCE: ${{ inputs.force }}
          PKG_NAME: ${{ steps.pkg.outputs.name }}
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
          CUR_HASH: ${{ steps.fingerprint.outputs.hash }}
          PREV_TAG: ${{ steps.previous.outputs.tag }}
          PREV_HASH: ${{ steps.previous.outputs.hash }}
        run: |
          if [ "$FORCE" != "true" ] && [ -n "$PREV_HASH" ] && [ "$PREV_HASH" = "$CUR_HASH" ]; then
            echo "::notice::packaged code is identical to $PREV_TAG - skipping publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "bump=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if npm view "$PKG_NAME@$PKG_VERSION" version > /dev/null 2>&1; then
            echo "::notice::$PKG_VERSION is already on npm - will bump patch"
            echo "bump=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$PKG_VERSION has never been published - publishing as-is"
            echo "bump=no" >> "$GITHUB_OUTPUT"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Bump the patch version
        if: steps.decide.outputs.publish == 'true' && steps.decide.outputs.bump == 'yes'
        run: npm version patch --no-git-tag-version

      - name: Publish to npm (OIDC, no token)
        if: steps.decide.outputs.publish == 'true'
        run: npm publish --provenance

      - name: Commit the version bump and tag the release
        if: steps.decide.outputs.publish == 'true'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          FINGERPRINT: ${{ steps.fingerprint.outputs.hash }}
        run: |
          version=$(node -p "require('./package.json').version")
          if ! git diff --quiet -- package.json package-lock.json; then
            git add package.json package-lock.json
            git commit -m "chore(release): $version [skip ci]"
            git push origin HEAD:main
          fi
          git tag -a "npm-release-$version" -m "release $version" -m "fingerprint: $FINGERPRINT"
          git push origin "npm-release-$version"